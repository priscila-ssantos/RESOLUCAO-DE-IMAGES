<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinturas</title>
    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/css/estilos.css">
    <link rel="stylesheet" href="src/css/responsivo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@700&display=swap" rel="stylesheet">

</head>

<body>
    <main>
        <section class="pinturas">
            <div class="pintura">
                <img src="src/rome.jpg" alt="pintura rome">
                <div class="informacoes">
                    <h2 class="título">Rome</h2>
                    <h3 class="subtítulo">Michelangelo</h3>
                </div>
            </div>
                <div class="pintura">
                    <img src="src/Boat at Sea.png" alt="pintura Boat at Sea">
                    <div class="informacoes">
                        <h2 class="título">Boat at Sea</h2>
                        <h3 class="subtítulo">Vincent Van Gogh</h3>
                    </div>
                </div>
                    <div class="pintura">
                        <img src="src/sand and sea.png.png" alt="pintura Sand and Sea">
                        <div class="informacoes">
                            <h2 class="título">Sand and Sea</h2>
                            <h3 class="subtítulo">Da vinci</h3>
                        </div>
                    </div>
                        <div class="pintura">
                            <img src="src/Starry Night.png" alt="pintura Starry Night">
                            <div class="informacoes">
                                <h2 class="título">Starry Night</h2>
                                <h3 class="subtítulo">Vincent Van Gogh</h3>
                            </div>
            </div>
        </section>
    </main>
</body>

</html>
